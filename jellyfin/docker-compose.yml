services:
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    network_mode: host
    user: 1000:1000
    group_add:
      - "983"
      - "987"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - './config:/config'
      - './cache:/cache'
      - /home/bz/media:/media
    restart: unless-stopped
    environment:
      TZ: 'America/Toronto'
