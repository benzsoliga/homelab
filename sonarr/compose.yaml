services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - /home/bz/homelab/sonarr/config:/config
      - /home/bz/media:/media
    ports:
      - 8989:8989
    mem_limit: 512m
    restart: unless-stopped
